<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weekframe">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Weekframe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap">
<style>
/* Layout: one screen app. Top bar, category strip, scrolling week grid; editor slides in from the right (bottom sheet on phones). */
:root{
  --bg:#FAFAF8;--surface:#FFFFFF;--sunk:#F3F3EF;--line:#E7E7E2;--line2:#F1F1ED;
  --ink:#1A1B19;--muted:#787973;--faint:#A7A8A1;--accent:#1A1B19;--on-accent:#FFFFFF;
  --today:#F5F5F0;--danger:#C2362F;--now:#E5484D;--ok:#2E8B57;
  --shadow:0 1px 2px rgba(20,20,15,.05),0 10px 30px rgba(20,20,15,.09);
  --font:'Geist',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111210;--surface:#191A18;--sunk:#20211E;--line:#2A2B28;--line2:#1F201D;
  --ink:#ECECE7;--muted:#8E8F88;--faint:#5F605B;--accent:#ECECE7;--on-accent:#111210;
  --today:#161714;--danger:#F0756E;--now:#FF6B6F;--ok:#5CC48C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111210;--surface:#191A18;--sunk:#20211E;--line:#2A2B28;--line2:#1F201D;
  --ink:#ECECE7;--muted:#8E8F88;--faint:#5F605B;--accent:#ECECE7;--on-accent:#111210;
  --today:#161714;--danger:#F0756E;--now:#FF6B6F;--ok:#5CC48C;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);color-scheme:dark}

.cat{--f:var(--l-f);--t:var(--l-t);--s:var(--l-s)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cat{--f:var(--d-f);--t:var(--d-t);--s:var(--d-s)}}
:root[data-theme="dark"] .cat{--f:var(--d-f);--t:var(--d-t);--s:var(--d-s)}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow:hidden}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.shell{display:flex;height:100%}
.side{width:224px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:14px 10px max(14px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));transition:margin-left .3s cubic-bezier(.2,.8,.2,1);z-index:10}
.shell.off .side{margin-left:-225px}
.shead{display:flex;align-items:center;gap:9px;padding:2px 4px 16px 8px}
.bname{font-weight:600;font-size:15px;letter-spacing:-.01em;flex:1}
.sclose{color:var(--muted)}
.snav{display:flex;flex-direction:column;gap:2px}
.nav{display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:9px;font-size:14px;font-weight:500;color:var(--muted);transition:background .15s,color .15s;width:100%;text-align:left}
.nav:hover{background:var(--sunk);color:var(--ink)}
.nav.on{background:var(--sunk);color:var(--ink)}
.nav.on svg{color:var(--accent)}
.nav .nl{flex:1}
.nav kbd{font-family:var(--mono);font-size:10.5px;color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:0 5px;line-height:17px}
.sfill{flex:1}
.sundo{display:flex;gap:2px;padding:0 2px 6px;border-bottom:1px solid var(--line2);margin-bottom:6px}
.sopen{position:fixed;top:max(14px,env(safe-area-inset-top,0px));left:max(12px,env(safe-area-inset-left,0px));width:36px;height:36px;border-radius:9px;background:var(--surface);border:1px solid var(--line);display:none;align-items:center;justify-content:center;z-index:12;color:var(--muted)}
.sopen:hover{color:var(--ink)}
.shell.off .sopen{display:flex}
.shell.off .app{padding-left:max(60px,env(safe-area-inset-left,0px))}
.app{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;padding-top:18px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));transition:padding .3s cubic-bezier(.2,.8,.2,1)}
body.drawer-open .app{padding-right:calc(380px + max(20px,env(safe-area-inset-right,0px)))}
.page{padding-inline:max(4px,calc((100% - 1240px) / 2))}

.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:16px;padding-block:14px 14px}
.top .tabs{justify-self:center}
@media (max-width:980px){.top{grid-template-columns:auto minmax(0,1fr)}.top .tabs{grid-column:1/-1;grid-row:2;justify-self:stretch}.top .tab{flex:1}}
.brand{display:flex;align-items:center;gap:8px;font-weight:500;font-size:13px;color:var(--muted);letter-spacing:.01em}
.mark{width:18px;height:18px;border-radius:5px;background:var(--accent);position:relative}
.mark::after{content:"";position:absolute;left:4px;right:4px;top:7px;height:2px;background:var(--on-accent);border-radius:2px;box-shadow:0 4px 0 var(--on-accent)}
.ttname{display:flex;align-items:center;gap:6px;font-size:26px;font-weight:600;letter-spacing:-.025em;line-height:1.1;padding:4px 8px;margin-left:-8px;border-radius:8px}
.ttname:hover{background:var(--sunk)}
.ttname svg{width:16px;height:16px;color:var(--muted)}
.nn{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:5px 11px 5px 9px;border-radius:999px;min-width:0;max-width:100%}
.nn b{color:var(--ink);font-weight:500}
.nn .dot{width:7px;height:7px;border-radius:50%;background:var(--now);flex:none;animation:pulse 2s ease-in-out infinite}
.nn .dot.idle{background:var(--faint);animation:none}
.nn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes pulse{50%{opacity:.35}}
.tools{justify-self:end;display:flex;gap:4px;align-items:center}
.ib{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;min-width:34px;padding:0 8px;border-radius:8px;color:var(--ink);font-size:13px;font-weight:500}
.ib:hover{background:var(--sunk)}
.ib.on{background:var(--sunk)}
.ib.solid{background:var(--accent);color:var(--on-accent);padding:0 12px}
.ib.solid:hover{opacity:.88}
.sep{width:1px;height:20px;background:var(--line);margin:0 4px}

.banner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:8px 12px;margin-bottom:10px;color:var(--muted)}
.banner b{color:var(--ink);font-weight:500}
.banner .sp{flex:1}
.lk{font-weight:500;color:var(--ink);padding:4px 8px;border-radius:6px}
.lk:hover{background:var(--sunk)}

.chips{display:flex;gap:6px;align-items:center;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;white-space:nowrap;transition:transform .12s,opacity .15s,background .15s}
.chip:hover{transform:translateY(-1px)}
.chip .sw{width:10px;height:10px;border-radius:3px;background:var(--s)}
.chip .h{font-family:var(--mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip.act{background:var(--f);border-color:var(--s);color:var(--t)}
.chip.act .h{color:var(--t)}
.chip.faded{opacity:.45}
.chip.ghost{color:var(--muted);border-style:dashed}

.gwrap{position:relative;flex:1;min-height:0;display:flex;flex-direction:column}
.gw{flex:1;min-height:0;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:max(14px,env(safe-area-inset-bottom,0px));position:relative;overscroll-behavior:contain}
.ghint{position:absolute;left:50%;top:34%;transform:translate(-50%,-50%);width:min(340px,calc(100% - 96px));background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none;z-index:8}
.ghint b{font-size:16px;font-weight:600}
.ghint p{margin:0;color:var(--muted);font-size:13px}
.ghint .row{justify-content:center;pointer-events:auto}
.ghint .glyph{width:44px;height:44px;border-radius:12px;background:var(--sunk);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.grid{display:grid;position:relative;min-width:100%;user-select:none;-webkit-user-select:none}
.gh{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.gh.corner{left:0;z-index:7;flex-direction:row;gap:0}
.gh .dn{font-weight:500;font-size:13px;display:flex;align-items:center;gap:6px}
.gh .dhr{font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.gh.today .dn{background:var(--accent);color:var(--on-accent);padding:2px 10px;border-radius:999px}
.zb{width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.zb:hover{background:var(--sunk);color:var(--ink)}
.zb svg{width:14px;height:14px}
.tc{position:sticky;left:0;z-index:4;background:var(--surface);border-right:1px solid var(--line)}
.tl{position:absolute;right:8px;transform:translateY(-50%);font-family:var(--mono);font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;white-space:nowrap}
.col{position:relative;border-left:1px solid var(--line2);
  background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px),linear-gradient(to bottom,var(--line2) 1px,transparent 1px);
  background-size:100% var(--hh),100% calc(var(--hh) / 2);cursor:crosshair}
.col:first-of-type{border-left:0}
.col.today{background-color:var(--today)}
.nowl{position:absolute;left:-1px;right:0;height:2px;background:var(--now);z-index:3;pointer-events:none}
.nowl::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--now)}

.blk{position:absolute;border-radius:8px;background:var(--f);color:var(--t);padding:5px 8px;overflow:hidden;cursor:grab;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--s) 28%,transparent);touch-action:manipulation;
  transition:box-shadow .15s,opacity .2s,transform .15s}
.blk.new{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.blk:hover{box-shadow:inset 0 0 0 1px var(--s)}
.blk.sel{box-shadow:inset 0 0 0 2px var(--s),var(--shadow);z-index:2;touch-action:none}
.blk.dragging{cursor:grabbing;z-index:6;box-shadow:inset 0 0 0 2px var(--s),var(--shadow);transform:scale(1.02);transition:none;animation:none}
.blk.dim{opacity:.22}
.blk .bt{font-weight:500;font-size:12.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .bm{font-family:var(--mono);font-size:11px;color:var(--s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums;margin-top:1px}
.blk .bl{font-size:11.5px;color:var(--s);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .bn{font-size:11.5px;line-height:15px;color:var(--t);opacity:.78;white-space:pre-wrap;word-break:break-word;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;margin-top:2px}
.blk.cmp{display:flex;align-items:center;gap:6px;padding-block:2px}
.blk.cmp .bm{margin:0}
.blk.tiny{padding-block:0}
.blk.tiny .bt{font-size:11px}
.blk.clash::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--now)}
.blk.done{opacity:.55}
.blk.done .bt{text-decoration:line-through}
.rh{position:absolute;left:0;right:0;bottom:0;height:9px;cursor:ns-resize;touch-action:none}
.rh::after{content:"";position:absolute;left:50%;bottom:3px;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:var(--s);opacity:0;transition:opacity .15s}
.blk:hover .rh::after,.blk.sel .rh::after{opacity:.6}
.gst{position:absolute;left:3px;right:3px;border-radius:8px;background:var(--f);box-shadow:inset 0 0 0 2px var(--s),var(--shadow);z-index:5;pointer-events:none;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--t);padding:4px 8px;overflow:hidden}

.drawer{position:fixed;top:0;right:0;bottom:0;width:380px;max-width:100%;background:var(--surface);border-left:1px solid var(--line);z-index:30;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);
  transform:translateX(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow)}
body.drawer-open .drawer{transform:none}
.dh{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line2)}
.dh h2{font-size:15px;font-weight:600;margin:0;flex:1;letter-spacing:-.01em}
.db{flex:1;overflow-y:auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:18px}
.fld{display:flex;flex-direction:column;gap:7px}
.lab{font-size:11.5px;font-weight:500;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.inp{width:100%;height:38px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 11px;font-size:14px;outline:none}
.inp:focus{border-color:var(--accent)}
textarea.inp{height:76px;padding:9px 11px;resize:vertical}
.inp.big{height:44px;font-size:17px;font-weight:500}
input[type=time].inp{font-family:var(--mono);font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>.grow{flex:1;min-width:0}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.sg{height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--line);font-size:12.5px;font-weight:500;background:var(--bg)}
.sg:hover{border-color:var(--faint)}
.sg.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.sg.cat.on{background:var(--f);color:var(--t);border-color:var(--s)}
.sg .sw{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--s);margin-right:6px;vertical-align:1px}
.err{font-size:12.5px;color:var(--danger);margin:0}
.ok{font-size:12.5px;color:var(--ok);margin:0}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.btn{height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;background:var(--surface)}
.btn:hover{border-color:var(--faint)}
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.dan{color:var(--danger)}
.btn.dan.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn svg{width:16px;height:16px}
.foot{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px;border-top:1px solid var(--line2);padding-top:16px}
.crow{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:10px}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.pd{width:22px;height:22px;border-radius:6px;background:var(--s);border:2px solid transparent}
.pd.on{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--surface)}
.palpop{position:fixed;z-index:60;display:grid;grid-template-columns:repeat(7,24px);gap:7px;padding:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);animation:popin .14s ease-out}
.palpop .pd{width:24px;height:24px}
.palpop .pd:hover{transform:scale(1.1)}
@keyframes popin{from{opacity:0;transform:translateY(-4px)}}
.cnt{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.statbig{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.sb{background:var(--sunk);border-radius:10px;padding:10px 12px}
.sb .v{font-size:22px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.sb .k{font-size:12px;color:var(--muted)}
.bar{display:grid;grid-template-columns:minmax(0,110px) minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:13px}
.bar .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tr{height:10px;border-radius:5px;background:var(--sunk);overflow:hidden}
.bar .fl{height:100%;border-radius:5px;background:var(--s);transform-origin:left;animation:grow .5s ease-out}
@keyframes grow{from{transform:scaleX(0)}}
.bar .n{font-family:var(--mono);font-size:12px;text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.daybars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;height:90px}
.dbx{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.dbx i{display:block;width:100%;max-width:26px;border-radius:5px 5px 2px 2px;background:var(--accent);opacity:.85;animation:rise .5s ease-out;transform-origin:bottom}
@keyframes rise{from{transform:scaleY(0)}}
.dbx span{font-size:11px;color:var(--muted)}
.prev{border:1px solid var(--line);border-radius:10px;width:100%;display:block}
.ttl{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:10px}
.ttl.on{border-color:var(--accent)}
.ttl .inp{height:32px;background:transparent;border-color:transparent;padding:0 6px}
.ttl .inp:focus{border-color:var(--line)}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:12.5px;color:var(--muted)}
.kbd kbd{font-family:var(--mono);font-size:11.5px;background:var(--sunk);border:1px solid var(--line);border-radius:5px;padding:1px 6px;color:var(--ink);white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--accent)}

.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translate(-50%,-160%);opacity:0;visibility:hidden;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:9px 10px 9px 14px;font-size:13px;display:flex;gap:10px;align-items:center;z-index:40;transition:transform .28s cubic-bezier(.2,.8,.2,1),opacity .2s,visibility .28s;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:761px){.shell:not(.off)~.toast{left:calc(50% + 112px)}}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.toast button{font-weight:600;padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--on-accent) 15%,transparent)}
.toast button[hidden]{display:none}

.scrim{display:none}
@media (max-width:760px){
  body.drawer-open .app{padding-right:max(16px,env(safe-area-inset-right,0px))}
  .drawer{top:auto;left:0;width:100%;height:78%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;transform:translateY(102%);padding-left:env(safe-area-inset-left,0px)}
  body.drawer-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:29}
  .ttname{font-size:17px}
  .tools .lbl{display:none}
  .nn{order:5;width:100%}
}
.tabs{position:relative;display:flex;gap:2px;background:var(--sunk);border-radius:10px;padding:3px}
.tab{position:relative;z-index:1;height:30px;padding:0 14px;border-radius:7px;font-size:13px;font-weight:500;color:var(--muted);transition:color .2s}
.tab.on{color:var(--ink)}

}

function fallbackCopy(txt){const p=$('f-paste');p.value=txt;p.focus();p.select();$('bk-msg').textContent='Copy was blocked here, so the text is selected in the box below. Copy it manually.'}

async function offer(filename,data,msgEl){try{const blob=data instanceof Blob?data:new Blob([data]);const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);msgEl&&(msgEl.textContent='Saved.');return true}catch(e){msgEl&&(msgEl.textContent='That file could not be saved.');return false}}

function drawExport(){
  const st=S.set,days=vdays(),rs=st.start*60,re=st.end*60,H=46,cw=158,tw=58,pad=32,top=96,hh=40;

  const F='Geist, system-ui, sans-serif',M='"Geist Mono", ui-monospace, monospace';
  x.fillStyle='#FFFFFF';x.fillRect(0,0,W,Hh);
  x.fillStyle='#1A1B19';x.font=`600 24px ${F}`;x.textBaseline='alphabetic';x.fillText(TT().name||'Timetable',pad,pad+22);
  x.fillStyle='#787973';x.font=`400 13px ${F}`;x.fillText('Weekly timetable',pad,pad+42);
  let lx=W-pad;x.font=`500 12px ${F}`;[...S.cats].reverse().forEach(c=>{const p=PAL[c.col]||PAL.slate,w=x.measureText(c.name).width;lx-=w;x.fillStyle='#45463F';x.fillText(c.name,lx,pad+20);lx-=16;x.fillStyle=p[0][2];x.beginPath();x.roundRect(lx,pad+10,10,10,3);x.fill();lx-=14});
  const gy=top+hh,gx=pad+tw;
  x.textAlign='center';days.forEach((d,i)=>{x.fillStyle='#1A1B19';x.font=`500 13px ${F}`;x.fillText(DAYS[d],gx+cw*i+cw/2,top+24)});
  x.strokeStyle='#E7E7E2';x.lineWidth=1;
  for(let h=st.start;h<=st.end;h++){const y=gy+(h-st.start)*H+.5;x.beginPath();x.moveTo(gx,y);x.lineTo(gx+cw*days.length,y);x.stroke();
    {x.fillStyle='#A7A8A1';x.font=`400 10.5px ${M}`;x.textAlign='right';x.fillText(fmt(h*60),gx-8,h===st.start?y+10:h===st.end?y-2:y+4)}}
  x.textAlign='left';
  for(let i=0;i<=days.length;i++){const X=gx+cw*i+.5;x.beginPath();x.moveTo(X,gy);x.lineTo(X,gy+(re-rs)/60*H);x.stroke()}
  const clip=(t,w)=>{if(x.measureText(t).width<=w)return t;while(t.length&&x.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'};
  days.forEach((d,i)=>{lanes(WB().filter(b=>b.d===d)).forEach(b=>{
    const t=(Math.max(b.s,rs)-rs)/60*H,bt=(Math.min(b.e,re)-rs)/60*H;if(bt<=t)return;
    const p=(PAL[colOf(b)]||PAL.slate)[0],w=(cw-8)/b._n,X=gx+cw*i+4+b._l*w,Y=gy+t+2,h=bt-t-4;
    x.fillStyle=p[0];x.beginPath();x.roundRect(X,Y,w-3,h,7);x.fill();
    x.save();x.beginPath();x.rect(X,Y,w-3,h);x.clip();
    x.fillStyle=p[1];x.font=`500 12px ${F}`;x.fillText(clip(b.title||'Untitled',w-16),X+8,Y+16);
    if(h>34){x.fillStyle=p[2];x.font=`400 10.5px ${M}`;x.fillText(clip(`${fmt(b.s)}–${fmt(b.e)}`,w-16),X+8,Y+31)}
    let cy=Y+46;x.font=`400 11px ${F}`;if(h>52&&b.loc){x.fillText(clip(b.loc,w-16),X+8,cy);cy+=15}
    if(cy<=Y+h-5&&bTags(b).length){let tx=X+7;bTags(b).forEach(id=>{const sp=getSp(id),sc=(PAL[sp.col]||PAL.slate)[0];x.font=`500 10.5px ${F}`;const tw=Math.min(x.measureText(sp.name||'Split').width+14,X+w-9-tx);if(tw<20)return;x.fillStyle=sc[2];x.globalAlpha=.18;x.beginPath();x.roundRect(tx,cy-11,tw,16,8);x.fill();x.globalAlpha=1;x.fillStyle=sc[1];x.fillText(clip(sp.name||'Split',tw-14),tx+7,cy);tx+=tw+4});cy+=19}
    if(b.notes&&cy<=Y+h-5){x.font=`400 11px ${F}`;x.globalAlpha=.8;x.fillStyle=p[1];x.fillText(clip(b.notes.replace(/\s+/g,' '),w-16),X+8,cy);x.globalAlpha=1}
    x.restore()})});
  return cv;
}
function loadJsPDF(){return new Promise((res,rej)=>{if(window.jspdf)return res(window.jspdf);const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js';s.onload=()=>res(window.jspdf);s.onerror=rej;document.head.appendChild(s)})}

  const el=document.createElement('div');el.className='dwheel';el.setAttribute('role','dialog');el.setAttribute('aria-label',DW.t?'Pick a time':'Pick a date');document.body.appendChild(el);DW.el=el;dwRender();dwPlace();
  el.addEventListener('mousedown',e=>e.preventDefault());
  el.addEventListener('pointerdown',e=>{const c=e.target.closest('.dwc');if(!c){e.preventDefault();return}if(e.pointerType!=='mouse'||e.button>0)return;e.preventDefault();DW.drag={c,y:e.clientY,top:c.scrollTop,moved:false,id:e.pointerId};c.classList.add('drag');try{c.setPointerCapture(e.pointerId)}catch(_){}});
  el.addEventListener('pointermove',e=>{const d=DW.drag;if(!d||e.pointerId!==d.id)return;const dy=(e.clientY-d.y)/ZF();if(Math.abs(dy)>3)d.moved=true;d.c.scrollTop=d.top-dy});
  const end=e=>{const d=DW.drag;if(!d)return;DW.drag=null;d.c.classList.remove('drag');if(d.moved){DW.supClick=Date.now();const c=d.c,step=32,tgt=Math.round(c.scrollTop/step)*step;c.scrollTo({top:tgt,behavior:motionOK()?'smooth':'auto'});dwSettle(c)}};
  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
  el.addEventListener('click',e=>{const it=e.target.closest('.dwi'),b=e.target.closest('[data-dw]');
    if(it){if(Date.now()-(DW.supClick||0)<250)return;DW.sel[it.dataset.k]=+it.dataset.v;if(!DW.t)DW.sel.d=Math.min(DW.sel.d,dimOf(DW.sel.y,DW.sel.m));dwSetVal();dwRender();return}
    if(!b)return;const k=b.dataset.dw;if(k==='today'){const t=new Date();DW.sel={y:t.getFullYear(),m:t.getMonth(),d:t.getDate()};dwSetVal();dwRender()}
    else if(k==='now'){const t=new Date();DW.sel={h:t.getHours()%12||12,mi:Math.round(t.getMinutes()/5)*5%60,ap:t.getHours()>=12?1:0};dwSetVal();dwRender()}
    else if(k==='clear'){DW.inp.value='';DW.inp.dispatchEvent(new Event('input',{bubbles:true}));dwClose()}else if(k==='done')dwClose()})}
function dwClose(silent){if(!DW.el)return;const inp=DW.inp,changed=inp&&inp.value!==DW.start;DW.el.remove();DW.el=null;DW.inp=null;DW.drag=null;if(changed&&inp.isConnected)inp.dispatchEvent(new Event('change',{bubbles:true}))}
const dwTouch=()=>{try{return matchMedia('(hover:none) and (pointer:coarse)').matches}catch(e){return false}};
document.addEventListener('focusin',e=>{const t=e.target;if(t.matches&&t.matches('input[type=date],input[type=time]')&&!dwTouch())dwOpen(t)});
document.addEventListener('pointerdown',e=>{if(!DW.el)return;if(DW.el.contains(e.target)||e.target===DW.inp)return;dwClose()},true);
document.addEventListener('input',e=>{if(DW.el&&e.target===DW.inp&&e.isTrusted){const p=DW.t?dwParseT(DW.inp.value):dwParse(DW.inp.value);if(p){DW.sel=p;dwRender()}}});
document.addEventListener('keydown',e=>{if(!DW.el||e.target!==DW.inp)return;if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();DW.inp.value=DW.start;dwClose(true);return}if(e.key==='Enter'||e.key==='Tab'){if(e.key==='Enter')e.preventDefault();dwClose()}},true);
document.addEventListener('scroll',e=>{if(DW.el&&!DW.el.contains(e.target))dwPlace()},{capture:true,passive:true});
window.addEventListener('resize',()=>{if(DW.el)dwPlace()});
document.addEventListener('focusout',e=>{if(DW.el&&e.target===DW.inp)setTimeout(()=>{if(DW.el&&document.activeElement!==DW.inp)dwClose()},120)});

/* ---------- calendar ---------- */
function motionOK(){try{return !matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return true}}
let calM=null,calSel=null;
function renderCal(){const P=$('p-cal');if(!P)return;const today=ymd(new Date());if(!calSel)calSel=today;if(!calM){const d=ymdP(calSel);calM=new Date(d.getFullYear(),d.getMonth(),1)}
  const start=monOf(calM),days=[];for(let i=0;i<42;i++){const d=new Date(start);d.setDate(d.getDate()+i);days.push(d)}
  const byDate={};S.hist.forEach(h=>{(byDate[h.date]=byDate[h.date]||[]).push(h)});
  const exOf=ds=>{const d=ymdP(ds),dow=(d.getDay()+6)%7,L=S.wlog&&S.wlog[weekOf(ds)],hs=byDate[ds]||[],done=new Set(hs.map(h=>h.splitId||'')),out=[],seen=new Set();
    (L?L.items:[]).filter(x=>x.d===dow).flatMap(x=>x.splits.length?x.splits.map(id=>{const sp=getSp(id);return {...x,title:sp?sp.name||'Split':x.title,col:sp?sp.col:x.col,splits:[id]}}):[x]).forEach(x=>{const k=x.title+'|'+x.s;if(seen.has(k))return;seen.add(k);out.push({...x,lg:x.splits.some(id=>done.has(id))})});
    [...done].forEach(id=>{if(out.some(x=>x.splits.includes(id)))return;const sp=getSp(id);out.push({title:sp?sp.name||'Split':'Training',col:sp?sp.col:'slate',splits:[id],lg:true,s:-1})});return out};
  migrateGoals();const gBy={},push=(d,x)=>(gBy[d]=gBy[d]||[]).push(x),AG=allGoals().filter(x=>x.g.status!=='off');AG.forEach(({p,g})=>{if(g.due)push(g.due,{_gd:1,p,g,col:p.col,title:pName(p)+' - '+(g.title||'goal')});g.ms.forEach(m=>{if(m.due)push(m.due,{_ms:1,p,g,m,col:p.col,title:m.t||'Milestone'})})});
  days.forEach(d=>{const ds=ymd(d);AG.forEach(({p,g})=>{if(checkinsIn(g,ds))push(ds,{_ci:1,p,g,col:p.col,title:'Check in: '+(g.title||'goal')})})});
  const mGoals=Object.entries(gBy).filter(([d,xs])=>{const x=ymdP(d);return x.getMonth()===calM.getMonth()&&x.getFullYear()===calM.getFullYear()}).reduce((a,[d,xs])=>a+xs.filter(x=>!x._ci).length,0),mDays=new Set(S.hist.filter(h=>{const d=ymdP(h.date);return d.getMonth()===calM.getMonth()&&d.getFullYear()===calM.getFullYear()}).map(h=>h.date)).size;
  const isCur=calM.getMonth()===new Date().getMonth()&&calM.getFullYear()===new Date().getFullYear();
  let h=`<div class="calh"><h1>Calendar</h1><span class="hint">${mDays} training day${mDays===1?'':'s'} · ${mGoals} goal${mGoals===1?'':'s'} and milestone${mGoals===1?'':'s'} due</span><span class="sp"></span><div class="calnav"><button class="ib" data-act="calm" data-d="-1" aria-label="Previous month">${ic('back')}</button><span class="calmon ${isCur?'cur':''}" id="calmon" aria-live="polite">${calM.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</span><button class="ib fwd" data-act="calm" data-d="1" aria-label="Next month">${ic('back')}</button></div></div>
  <div class="calw"><div class="card calg"><div class="cdow">${DOWS.map(x=>`<span>${x}</span>`).join('')}</div><div class="cgrid">`;
  days.forEach(d=>{const ds=ymd(d),inM=d.getMonth()===calM.getMonth(),hs=byDate[ds]||[],gs=gBy[ds]||[],sps=[...new Set(hs.map(x=>x.splitId||''))],pl=(TT()?TT().blocks:[]).filter(b=>b.wk===weekOf(ds)&&b.d===(d.getDay()+6)%7).reduce((a,b)=>a+b.e-b.s,0);
    h+=`<button class="cc ${inM?'':'out'} ${ds<today?'past':''} ${ds===today?'tod':''} ${ds===calSel?'sel':''}" data-act="calday" data-d="${ds}" aria-label="${esc(d.toDateString())}${hs.length?', trained':''}${gs.length?', '+gs.length+' goal due':''}" aria-pressed="${ds===calSel}"><span class="cn">${d.getDate()}</span>${pl?`<span class="cpl">${hrs(pl)} planned</span>`:''}`+
      (()=>{const ex=exOf(ds),ne=ex.length,ng=Math.min(gs.length,Math.max(0,3-ne)),more=gs.length-ng;
        return `<span class="ccaps">`+ex.slice(0,ne).map(x=>`<span class="ccap cat" style="${catVars(x.col)}" title="${esc(x.title)}${x.lg?', logged in Training':''}"><i class="ccd ${x.lg?'on':''}"></i><span class="cct">${esc(x.title)}</span></span>`).join('')+gs.slice(0,ng).map(g=>`<span class="ccap cat ${g._ci?'ci':''}" style="${catVars(g.col)}" title="${esc(g.title||'')}">${ic(g._ms?'pin':g._ci?'calendar':'target')}<span class="cct">${esc(g._ms?g.title:g._ci?'Check in':g.title||'Untitled goal')}</span></span>`).join('')+(more>0?`<span class="cmore">+${more} more</span>`:'')+`</span>`})()+`</button>`});
  h+=`</div></div><div class="card cald">${dayDetail(calSel,byDate[calSel]||[],gBy[calSel]||[],exOf(calSel))}</div></div>`;
  still(P,'cal');P.innerHTML=h}
function dayDetail(ds,hs,gs,ex){ex=ex||[];const d=ymdP(ds),dow=(d.getDay()+6)%7,bl=(TT()?TT().blocks:[]).filter(b=>b.d===dow&&b.wk===weekOf(ds)).sort((a,b)=>a.s-b.s);
  const sess=new Set(hs.map(x=>x.splitId||'')).size,sets=hs.reduce((a,x)=>a+(+x.sets||0),0),sch=bl.reduce((a,b)=>a+b.e-b.s,0),kc=hs.filter(x=>exInfo(x.exId).group==='Cardio').reduce((a,x)=>a+kcalOf(x),0);
  const rel=ds===ymd(new Date())?'Today':ds===ymd(new Date(Date.now()-864e5))?'Yesterday':d.toLocaleDateString(undefined,{weekday:'long'});
  let h=`<div class="cdh"><div class="lab">${esc(rel)}</div><h2>${d.toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'})}</h2></div>
   <div class="ostat4 c2">${[[sess||0,'sessions'],[hs.length,'exercises'],[sets,'sets'],[sch?hrs(sch):'None','scheduled']].map(tileHTML).join('')}</div>`;
  h+=`<div class="csec"><span class="lab">Training</span>`;
  {const by={};hs.forEach(x=>{const k=x.splitId||'';(by[k]=by[k]||[]).push(x)});const cards=[],used=new Set();
   ex.forEach(x=>{const id=x.splits[0];if(id){if(used.has(id))return;used.add(id);const sp=getSp(id),L=by[id];cards.push({title:sp?sp.name||'Split':x.title,col:sp?sp.col:x.col,lg:!!L,time:x.s>=0?`${fmt(x.s)} to ${fmt(x.e)}`:'',rows:L?L.map(r=>[exInfo(r.exId).name,specOf(r)]):(sp?sp.items.filter(i=>i.exId).map(i=>[exInfo(i.exId).name,specOf(i)]):[])})}else cards.push({title:x.title,col:x.col,lg:false,time:x.s>=0?`${fmt(x.s)} to ${fmt(x.e)}`:'',rows:[]})});
   Object.entries(by).forEach(([k,L])=>{if(used.has(k))return;const sp=getSp(k);cards.push({title:sp?sp.name||'Split':'No split',col:sp?sp.col:'slate',lg:true,time:'',rows:L.map(r=>[exInfo(r.exId).name,specOf(r)])})});
   if(cards.length){h+=cards.map(c=>`<div class="ctr"><div class="ctrh cat" style="${catVars(c.col)}"><i class="ccd ${c.lg?'on':''}"></i><b>${esc(c.title)}</b><span class="hint">${c.time||(c.rows.length?c.rows.length+' exercise'+(c.rows.length===1?'':'s'):'')}</span></div>${c.rows.map(r=>`<div class="ctrr"><span>${esc(r[0])}</span><span>${r[1]}</span></div>`).join('')}</div>`).join('');if(kc)h+=`<p class="hint">About ${Math.round(kc)} kcal burned on cardio, estimated.</p>`}
   else h+=`<p class="hint">${ds>ymd(new Date())?'Nothing planned yet.':'No training this day.'}</p>`}
  h+='</div>';
  h+=`<div class="csec"><div class="csh"><span class="lab">Goals</span><button class="lk" data-act="calgoal" data-d="${ds}">${ic('plus')}New project</button></div>`;
  const gx=x=>{const at=`data-act="calopen" data-id="${x.p.id}" data-g="${x.g.id}"`;if(x._ms){const st=msStat(x.m);return `<button class="cgoal cat" style="${catVars(x.col)}" ${at}><span class="gdot"></span><span class="cgt"><b>${esc(x.m.t||'Milestone')}${x.m.time?' · '+fmtT(x.m.time):''}</b><span class="hint">${esc(pName(x.p))} - ${esc(x.g.title)} · ${st[0]}</span></span>${urgPill(x.m.urg)}</button>`}
    if(x._ci)return `<button class="cgoal cat" style="${catVars(x.col)}" ${at}><span class="gdot"></span><span class="cgt"><b>Check in</b><span class="hint">Review ${esc(pName(x.p))} - ${esc(x.g.title)}</span></span></button>`;
    const pc=gProg(x.g),dl=daysLeft(x.g.due);return `<button class="cgoal cat" style="${catVars(x.col)}" ${at}><span class="gdot"></span><span class="cgt"><b>${esc(pName(x.p))} - ${esc(x.g.title)}</b><span class="hint">Goal ends ${dl<0?(-dl)+' days ago':dl===0?'today':'in '+dl+' days'} · ${x.g.ms.filter(m=>m.d).length} of ${x.g.ms.length} milestones</span></span><span class="pbar"><i style="width:${pc}%"></i></span><span class="pct">${pc}%</span></button>`};
  h+=gs.length?gs.map(g=>{const sp=gx(g);if(sp)return sp;const p=Math.round(gProg(g)),dl=daysLeft(g.due);return `<button class="cgoal cat" style="${catVars(g.col)}" data-act="calopen" data-id="${g.id}"><span class="gdot"></span><span class="cgt"><b>${esc(g.title||'Untitled goal')}</b><span class="hint">${dl<0?(-dl)+' days over':dl===0?'Due today':dl+' day'+(dl===1?'':'s')+' left'}${g.ms.length?` · ${g.ms.filter(m=>m.d).length} of ${g.ms.length} milestones`:''}</span></span><span class="pbar"><i style="width:${p}%"></i></span><span class="pct">${p}%</span></button>`}).join(''):'<p class="hint">Nothing due this day.</p>';
  h+='</div>';
  h+=`<div class="csec"><span class="lab">Schedule</span>${bl.length?bl.map(b=>{const c=getC(b.cat);return `<div class="csch cat" style="${catVars(colOf(b))}"><span class="ctime">${fmt(b.s)}–${fmt(b.e)}</span><span class="cbar"></span><span class="cst"><b>${esc(b.title||'Untitled')}</b>${c||b.loc?`<span class="hint">${[c?esc(c.name):'',b.loc?esc(b.loc):''].filter(Boolean).join(' · ')}</span>`:''}</span></div>`}).join(''):`<p class="hint">${ds>ymd(new Date())?'No plans yet for this day.':ds===ymd(new Date())?'Nothing scheduled today.':'Nothing was scheduled.'}</p>`}</div>`;
  return h}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
  if(a==='calm'){const dir=+t.dataset.d;calM=new Date(calM.getFullYear(),calM.getMonth()+dir,1);renderCal();const g=document.querySelector('#p-cal .cgrid'),m=$('calmon');if(motionOK()){g&&g.animate&&g.animate([{transform:`translateX(${dir*48}px)`,opacity:0},{transform:'none',opacity:1}],{duration:280,easing:'cubic-bezier(.2,.8,.2,1)'});m&&m.animate&&m.animate([{transform:`translateX(${dir*14}px)`,opacity:0},{transform:'none',opacity:1}],{duration:240,easing:'ease-out'})}}
  else if(a==='caltoday'){calSel=ymd(new Date());calM=null;renderCal()}
  else if(a==='calday'){calSel=t.dataset.d;const d=ymdP(calSel);if(d.getMonth()!==calM.getMonth()||d.getFullYear()!==calM.getFullYear())calM=new Date(d.getFullYear(),d.getMonth(),1);renderCal()}
  else if(a==='calgoal'){gPreDue=t.dataset.d;gName='';gPDesc='';gTags=[];gColP=nextCol(S.projects.map(x=>x.col));gv='name';renderGoals();go(3);setTimeout(()=>{const f=$('g-name');f&&f.focus()},420)}
  else if(a==='calopen'){pOpen=t.dataset.id;gSel=t.dataset.g||null;gAdd=null;gv='goal';renderGoals();go(3);const P=$('p-goals');P&&(P.scrollTop=0)}});

/* ---------- boot ---------- */
applySide();
renderAll();go(page,true);
try{document.fonts.ready.then(placeInd)}catch(e){}
requestAnimationFrame(()=>{const st=S.set,n=nowMin();const y=(clamp(n,st.start*60,st.end*60)-st.start*60)/60*st.hourH-140;gw.scrollTop=Math.max(0,y)});
setInterval(()=>{if(!drag){renderGrid();renderNow()}},30000);
})();
